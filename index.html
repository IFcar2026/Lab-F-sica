<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema do Laboratório de Física - IFSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="botaoTema" class="botao-tema" onclick="alternarTema()" title="Alternar tema">🌙</button>

<div class="container">

    <div id="welcomeScreen">
        <h1 class="welcome-title">Laboratório de Física - IFSP<br><small style="font-size: 16px; color:#7f8c8d;">Selecione seu perfil de acesso</small></h1>
        <div class="btn-group">
            <button class="rect-button" onclick="entrarComoAluno()">SOU ALUNO<br><span style="font-size: 12px; font-weight: normal; display: block;">Acesso Rápido de Leitura</span></button>
            <button class="rect-button admin" onclick="mostrarTelaAuth()">SOU PROFESSOR / MONITOR<br><span style="font-size: 12px; font-weight: normal; display: block;">Painel de Controle</span></button>
        </div>
    </div>

    <div id="authScreen">
        <div class="auth-toggle">
            <span id="tabLogin" class="active" onclick="alternarTab('login')">Entrar</span>
            <span id="tabCadastro" onclick="alternarTab('cadastro')">Cadastrar</span>
        </div>

        <form id="formLogin" onsubmit="executarLogin(event)">
            <div class="form-group">
                <label for="loginId">ID de Usuário (LFXXXXXXX)</label>
                <input type="text" id="loginId" placeholder="Ex: LF1234567" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Senha</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">Entrar no Painel</button>
        </form>

        <form id="formCadastro" onsubmit="executarCadastro(event)" style="display: none;">
            <div class="form-group">
                <label for="cadNome">Nome Completo</label>
                <input type="text" id="cadNome" placeholder="Seu Nome" required>
            </div>
            <div class="form-group">
                <label for="cadPassword">Criar Senha</label>
                <input type="password" id="cadPassword" required>
            </div>
            <div class="form-group">
                <label for="cadPasswordConfirm">Confirme a Senha</label>
                <input type="password" id="cadPasswordConfirm" required>
            </div>
            <div class="form-group">
                <label for="cadChave">Chave do Laboratório (Código Mestre)</label>
                <input type="password" id="cadChave" placeholder="Digite a chave de segurança" required>
            </div>
            <button type="submit" class="btn-submit">Gerar meu ID e Cadastrar</button>
        </form>

        <a class="btn-back" onclick="voltarParaInicio()">← Voltar</a>
    </div>

    <div id="mainApp">
        <header>
            <div>
                <h1 style="margin:0; font-size: 24px;">Inventário de Física</h1>
                <span id="userStatus" style="font-size: 14px; color: #7f8c8d;">Modo: Leitura (Estudante)</span>
            </div>
            <button class="logout-btn" onclick="voltarParaInicio()">Sair / Bloquear</button>
        </header>

        <div id="adminPanel">
            <h3>⚙️ Painel de Gerenciamento (Acesso Restrito)</h3>
            
            <div class="admin-sections">
                <div class="admin-block">
                    <h4>+ Adicionar Experimento</h4>
                    <form id="formNovoExperimento" onsubmit="adicionarExperimentoNoGrid(event)">
                        <input type="text" id="expNome" placeholder="Nome do experimento" required>
                        <select id="expArea" required>
                            <option value="">Selecione a Área...</option>
                        </select>
                        <div id="expNovaCategoriaBloco" style="display:none; margin-bottom:10px;">
                            <input type="text" id="expNovaCategoriaNome" placeholder="Nome da nova categoria" style="margin-bottom:6px;">
                            <label style="font-size:12px; display:block; margin-bottom:4px;">Cor da categoria</label>
                            <input type="color" id="expNovaCategoriaCor" value="#3498db" style="height:38px; padding:2px; width:100%;">
                        </div>
                        <input type="text" id="expLocal" placeholder="Localização (Ex: Armário A)">
                        <input type="text" id="expComp" placeholder="Componentes integrantes">
                        <button type="submit" class="btn-admin-action">Cadastrar Kit</button>
                    </form>
                </div>

                <div class="admin-block">
                    <h4>📢 Postar Novo Aviso no Mural</h4>
                    <form id="formNovoAviso" onsubmit="adicionarAvisoNoMural(event)">
                        <input type="text" id="avisoAutor" placeholder="Seu Nome/Cargo (Ex: Prof. Carlos)" required>
                        <textarea id="avisoTexto" placeholder="Escreva a mensagem aqui..." rows="3" required></textarea>
                        <button type="submit" class="btn-admin-action notice-btn">Publicar Aviso</button>
                    </form>
                </div>

                <div class="admin-block">
                    <h4>🔧 Relatos Pendentes (<span id="contadorRelatos">0</span>)</h4>
                    <div id="relatosPendentesList" style="max-height: 220px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <div class="notice-board">
            <h2>📢 Quadro de Avisos do Laboratório</h2>
            <div id="noticeList" class="notice-list">
                </div>
        </div>

        <input type="text" id="searchBar" class="search-box" placeholder="Pesquise por nome do experimento ou área (ex: Mecânica, Óptica)...">

        <div id="experimentsGrid" class="grid"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="fecharModalSeClicouFora(event)">
        <div class="modal-content" id="modalConteudo"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
